<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunex.Scripts</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>LUNEX.SCRIPTS</h1>
  <p>استضف سورسات Lua لروبلوكس بروابط raw محمية — بدون تسجيل دخول</p>
</header>

<main>
  <section class="card">
    <h2>نشر / تحديث سورس</h2>
    <input id="f-name" placeholder="اسم السورس (حروف إنجليزية وأرقام فقط) مثل: auto-farm">
    <textarea id="f-code" placeholder="-- الصق كود Lua هنا"></textarea>
    <button onclick="publish()">نشر السورس</button>
  </section>

  <section class="card">
    <h2>سورساتي</h2>
    <div id="list" class="muted">...جاري التحميل</div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
