<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LunexScript - استضافة سورسات روبلوكس</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="app"></div>

<div id="toast" class="toast">تم الحفظ بنجاح</div>

<!-- Logs Modal -->
<div id="logsModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>سجل محاولات السحب (Access Logs)</h3>
      <button class="secondary" onclick="closeLogsModal()">✕ إغلاق</button>
    </div>
    <div class="modal-body" id="logsContent">جاري التحميل...</div>
    <div class="modal-footer">
      <button class="secondary" onclick="copyAllLogs()">📋 نسخ كل السجل</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
